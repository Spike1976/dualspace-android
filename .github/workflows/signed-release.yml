name: Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Load release signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.DUALSPACE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DUALSPACE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DUALSPACE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DUALSPACE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing production signing secrets. No release will be produced." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dualspace-release.jks"
          chmod 600 "$RUNNER_TEMP/dualspace-release.jks"
          {
            echo "DUALSPACE_KEYSTORE_PATH=$RUNNER_TEMP/dualspace-release.jks"
            echo "DUALSPACE_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "DUALSPACE_KEY_ALIAS=$KEY_ALIAS"
            echo "DUALSPACE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test lint and build signed APK and AAB
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DualSpace-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
