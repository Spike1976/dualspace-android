name: Android Debug Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted ubuntu-24.04 includes Android command line tools.
      # Avoid android-actions/setup-android@v3: its legacy "tools" package
      # installation fails on current Android SDK repositories.
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate Android SDK manager under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Enforce strict APK permission allowlist
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt"
          if [ ! -f "$APK" ] || [ ! -x "$AAPT" ]; then
            echo "Missing compiled APK or Android permission auditor" >&2
            exit 1
          fi
          "$AAPT" dump permissions "$APK" | tee /tmp/dualspace-permissions.txt
          # AndroidX generates this signature-protected, app-private receiver permission.
          # It cannot access WEX data and must not be confused with device permissions.
          unexpected="$(grep -E 'uses-permission(:|\\-sdk-23:)' /tmp/dualspace-permissions.txt | \
            sed -n "s/.*name='\\([^']*\\)'.*/\\1/p" | \
            grep -v '^com\\.dualspace\\.mvp\\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DualSpace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
 || true)"
          if [ -n "$unexpected" ]; then
            echo "SECURITY FAILURE: Unapproved permissions: $unexpected" >&2
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DualSpace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
